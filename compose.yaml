# SMAGA Talent Hub — local development stack.
# Start: docker compose up -d   ·   App: http://localhost:8090   ·   Mail: http://127.0.0.1:8035 (salinan smaga_server)
# All ports bind to 127.0.0.1 only.
# Every long-running service has restart: unless-stopped (SV1, lead 2026-10-30): after a power cut, a reboot or a
# Docker restart the stack comes back by itself (the school's server runs this file too); a service stopped by hand
# (docker compose stop / stop.bat) stays stopped.
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: sth-php:dev
  volumes:
    - .:/var/www/html
    # Dev-only PHP tuning (opcache/realpath). Loaded after zz-sth.ini from the image. See the file header:
    # it explains the Windows bind-mount cost and the one line to change after moving to a Linux filesystem.
    - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zzz-sth-dev.ini:ro
    # Dev-only php-fpm pool env: config cache + compiled views on the container's own filesystem, for php-fpm
    # workers only (never the command line, so never the test suite). See the file header and docker/php/dev-cache.sh.
    - ./docker/php/fpm.dev.conf:/usr/local/etc/php-fpm.d/zzz-sth-dev.conf:ro
  # No env_file here on purpose: Laravel reads the bind-mounted .env itself. Injecting it as process env
  # would override phpunit.xml and make the test suite run against (and wipe) the dev MySQL database.
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *php
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *php
    command: php artisan queue:work --queue=otp,mail,default --tries=3 --backoff=10
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sth
      MYSQL_USER: sth
      MYSQL_PASSWORD: sth_dev_password
      MYSQL_ROOT_PASSWORD: sth_dev_root
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP on purpose (127.0.0.1, not localhost = socket): on a fresh volume the image first runs a temporary init
      # server with --skip-networking; over the socket it already answers, so "healthy" came before port 3306 was up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psth_dev_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8035:8025"

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5183:5173"
    profiles: ["frontend"]

volumes:
  mysql-data:
