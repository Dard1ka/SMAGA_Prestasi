# SMAGA Talent Hub CI (docs/SECURITY.md §3k, docs/DEPLOY.md §18). Every job must pass before merge, except the
# npm audit step, which only warns. The production images and Trivy run in docker.yml.
#
# When it runs (2026-10-08): on every pull request, by hand, and weekly. It no longer runs again on the push to main
# after a merge: the pull request run already tested the merge result (main has no branch protection on this plan,
# so the second run only repeated the first and doubled the Actions minutes). The weekly run re-checks the audits
# against new advisories.
#
# Supply chain:
# - every action is pinned to a full commit SHA (comment = release tag); Dependabot (.github/dependabot.yml) bumps them
# - the gitleaks image is pinned by tag + digest below, Trivy in docker.yml, Playwright in tests/E2E/compose.e2e.yaml.
#   Those are bumped by hand in the monthly routine (docs/DEPLOY.md §13), Playwright together with
#   tests/E2E/package.json.
# - no secrets are used; the token is read-only.
name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # Monday 01:00 Asia/Jakarta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: mbstring, intl, zip, gd, bcmath, exif, pcntl, pdo_sqlite, sqlite3, pdo_mysql
  NODE_VERSION: "24"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  php:
    name: PHP · validate, Pint, audits, Pest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: composer validate
        run: composer validate --strict --no-check-publish

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Before composer install: without .env Laravel falls back to APP_ENV=production + MAIL_MAILER=log, and the
      # production boot guard (AppServiceProvider::guardUnsafeConfiguration) aborts `artisan package:discover`.
      - name: Prepare .env
        run: cp .env.example .env

      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # Reads composer.lock only; fails on any security advisory. Abandoned packages are reported, not fatal.
      # (Its own job until 2026-10-08; one runner less, same check.)
      - name: composer audit
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Pint
        run: vendor/bin/pint --test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Blade layouts reference the Vite manifest, so feature tests need built assets. This build is also the check
      # that the frontend compiles (the separate "Frontend" job only repeated it until 2026-10-08).
      - name: Build assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json

      # Non-blocking on purpose: all frontend packages are build-time only (assets are compiled into the image).
      - name: npm audit (production dependencies, warning only)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::npm audit found high/critical advisories in production dependencies"
          fi

      - name: App key
        run: php artisan key:generate --ansi

      - name: Pest (SQLite in memory, phpunit.xml)
        run: vendor/bin/pest

      # SECURITY §3b / D-15: the OTP test mode must make the app refuse to boot outside APP_ENV=local.
      - name: Boot guard for OTP test mode
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          MAIL_MAILER: smtp
        run: |
          STH_OTP_TEST_MODE=false php artisan about --only=environment > /dev/null
          if STH_OTP_TEST_MODE=true php artisan about --only=environment > /dev/null 2>&1; then
            echo "::error::the app booted with APP_ENV=production and STH_OTP_TEST_MODE=true"
            exit 1
          fi
          echo "boot guard OK"

  secrets:
    name: Secrets · gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every commit reachable from this ref; allowlists for fictional values live in .github/gitleaks.toml.
      # A finding means: rotate the secret first, then remove it from history. Never allowlist a real secret.
      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && gitleaks git --config .github/gitleaks.toml --redact --no-banner --verbose .'

  e2e:
    name: E2E · Playwright smoke (dev stack)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Isolated compose project "sth-e2e" = compose.yaml + E2E override (tests/E2E/compose.e2e.yaml).
      COMPOSE_FILE: compose.yaml:tests/E2E/compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev PHP image (docker/php/Dockerfile, target dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          tags: sth-php:dev
          load: true
          push: false
          cache-from: type=gha,scope=sth-php-dev
          cache-to: type=gha,mode=max,scope=sth-php-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: .env, vendor, app key (in the dev image)
        run: |
          cp .env.example .env
          docker run --rm -v "$GITHUB_WORKSPACE:/var/www/html" -w /var/www/html sth-php:dev \
            composer install --no-interaction --no-progress --prefer-dist
          docker run --rm -v "$GITHUB_WORKSPACE:/var/www/html" -w /var/www/html sth-php:dev \
            php artisan key:generate --ansi

      # Random per run, masked in the log; only valid inside this throwaway project.
      - name: E2E student password
        run: |
          pw="e2e-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "E2E_STUDENT_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Start mysql, app, web
        run: docker compose up -d --no-build --wait mysql app web

      - name: Fresh database, demo data, demo student
        run: docker compose exec -T app sh tests/E2E/support/setup-app.sh

      - name: Playwright smoke tests
        run: docker compose run --rm e2e

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 app web mysql
          docker compose exec -T app sh -c 'tail -n 200 storage/logs/laravel.log' || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/E2E/playwright-report
            tests/E2E/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the E2E project
        if: always()
        run: docker compose down -v --remove-orphans
