# Dependency updates (docs/SECURITY.md §3k): security updates merged within 7 days (CRITICAL within 48 hours).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }
    open-pull-requests-limit: 5

  # Base image digests in docker/Dockerfile.prod and docker/php/Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }

  - package-ecosystem: docker
    directory: /docker/php
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }

  # mysql digest in docker/compose.prod.yaml.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Jakarta }
