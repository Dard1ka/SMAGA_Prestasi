# smaga_server on the school's server, HTTPS on the IP address: https://112.78.41.197:8149 (no domain, no Cloudflare;
# the domain variant is compose.https.yaml, never both). Switched on with
# COMPOSE_FILE=compose.yaml:compose.server.yaml:compose.https-ip.yaml in the server's .env, together with
# APP_URL=https://112.78.41.197:8149 and SESSION_SECURE_COOKIE=true; the laptop ignores this file.
# Port 8149 then speaks TLS with the Let's Encrypt IP address certificate in STH_LETSENCRYPT_DIR (default
# /etc/letsencrypt on the host, requested and renewed by scripts/server/sertifikat-ip.sh; it must exist before web
# starts with this file); plain http on the port is sent to the same path over https (docker/nginx/https-ip.conf).
# Visitors reach the port directly (router port forward), so REMOTE_ADDR is already their address: no proxy to trust.
services:
  web:
    ports: !override
      - "8149:443"
    volumes:
      - ./docker/nginx/https-ip.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STH_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
