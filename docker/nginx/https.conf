# Nginx of the web container on the school's server behind Cloudflare (compose.https.yaml; the laptop keeps
# docker/nginx/default.conf). Cloudflare connects with HTTPS to port 8149 and checks this Cloudflare Origin certificate
# (SSL mode Full (strict) for prestasi.sman3-smg.sch.id). Certificate and key live on the server under STH_TLS_DIR
# (default /opt/sth-tls), never in the repo.

# Resolve `app` through Docker's embedded DNS at request time, as default.conf does (SV1).
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 443 ssl;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The visitor's address: from CF-Connecting-IP, and only when the connection itself comes from Cloudflare's
    # published ranges (https://www.cloudflare.com/ips, 2026-11-19). Cloudflare always sets that header to the address
    # that connected to it, so neither a direct visitor nor a request through another Cloudflare account (a Worker that
    # writes X-Forwarded-For) can choose it. PHP then gets that address as REMOTE_ADDR and the app trusts no
    # X-Forwarded-For at all (no STH_TRUSTED_PROXY in compose.https.yaml); the https scheme comes from this TLS port.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Plain http on this port (old links and the QR codes of letters printed before, http://112.78.41.197:8149/...):
    # nginx answers 497 there; send the visitor to the same path on the https domain.
    error_page 497 =301 https://prestasi.sman3-smg.sch.id$request_uri;

    # Same limits as default.conf: Laporan hasil sends up to 5 photos of 5 MB in one Livewire request (SV1).
    client_max_body_size 30m;
    server_tokens off;

    set $php_upstream app:9000;

    # No security headers here: App\Http\Middleware\SecurityHeaders is the single source.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }
}
