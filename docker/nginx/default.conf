# Nginx inside the web container (dev and prod). The host Apache proxies to this in production.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;
    server_tokens off;

    # No security headers here: App\Http\Middleware\SecurityHeaders is the single source (CSP nonce,
    # X-Frame-Options, nosniff, Referrer-Policy, …); adding them here sent each header twice.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }
}
