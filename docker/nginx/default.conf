# Nginx inside the web container of the dev stack (compose.yaml; also the school's server, which runs this stack).
# Production uses docker/nginx/prod.conf. The host Apache proxies to this in production.

# Resolve `app` through Docker's embedded DNS at request time (as prod.conf does), so recreating only the app
# container (a new STH_FPM_WORKERS value, an image rebuild) never leaves nginx on a stale IP answering 502 (SV1).
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Laporan hasil uploads up to 5 photos of 5 MB in ONE Livewire request; 12m refused 3 phone photos with 413 (SV1).
    # Same total as docker/php/php.dev.ini post_max_size.
    client_max_body_size 30m;
    server_tokens off;

    set $php_upstream app:9000;

    # No security headers here: App\Http\Middleware\SecurityHeaders is the single source (CSP nonce,
    # X-Frame-Options, nosniff, Referrer-Policy, …); adding them here sent each header twice.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }
}
