# Nginx of the web container on the school's server, HTTPS on the server's own IP address: https://112.78.41.197:8149
# (compose.https-ip.yaml; the laptop keeps docker/nginx/default.conf; the Cloudflare/domain variant is https.conf).
# The certificate is a Let's Encrypt IP address certificate (shortlived profile, about 6 days), requested and renewed on
# the host by scripts/server/sertifikat-ip.sh, which reloads this nginx after a renewal. /etc/letsencrypt is mounted
# whole, so the live/ symlinks into archive/ resolve.

# Resolve `app` through Docker's embedded DNS at request time, as default.conf does (SV1).
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 443 ssl;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/112.78.41.197/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/112.78.41.197/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Plain http on this port (old links and the QR codes of letters printed before, http://112.78.41.197:8149/...):
    # nginx answers 497 there; send the visitor to the same path over https.
    error_page 497 =301 https://112.78.41.197:8149$request_uri;

    # Same limits as default.conf: Laporan hasil sends up to 5 photos of 5 MB in one Livewire request (SV1).
    client_max_body_size 30m;
    server_tokens off;

    set $php_upstream app:9000;

    # No security headers here: App\Http\Middleware\SecurityHeaders is the single source.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }
}
