# SMAGA Talent Hub: nginx inside the production `web` container (docker/Dockerfile.prod target `web`,
# nginxinc/nginx-unprivileged, uid 101, read-only rootfs, listens on 8080).
# Chain: browser → Apache 2.4.29 on the host (TLS) → 127.0.0.1:8080 → docker-proxy → this server → app:9000.
# Host validation is done by Laravel TrustHosts, security headers by the Laravel middleware (single source)
# + Apache (setifempty, also covers /build/ static files), HSTS only by Apache. nginx adds no security
# headers (they were sent twice). See docs/SECURITY.md §3e/§3f/§3j.

server_tokens off;

# Same upload limit on all three layers (SECURITY §3d): PHP post_max_size 25M, Apache LimitRequestBody 25 MB.
client_max_body_size 25m;
client_body_buffer_size 128k;
client_body_timeout 60s;
client_header_timeout 30s;

# Resolve `app` through Docker's embedded DNS at request time, so recreating the app container never leaves
# nginx pointing at a stale IP.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8080 default_server;
    server_name _;
    keepalive_timeout 30s;   # nginx.conf sets 65s at http level; overriding it there is a duplicate

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    set $php_upstream app:9000;

    # Container healthcheck (docker/compose.prod.yaml); never reaches PHP.
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite output: content-hashed file names, safe to cache for a year. Compressed here only
    # (dynamic HTML with CSRF tokens is not gzipped, BREACH).
    location ^~ /build/ {
        access_log off;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
        gzip_min_length 1024;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # Dotfiles (.env, .git, .htaccess) and anything that looks like a secret, dump or log → 404.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(env|ini|log|sql|sqlite|bak|old|orig|swp|lock|dist)$ { return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is ever executed. Any other *.php → 404.
    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # httpoxy: never let a client-supplied "Proxy:" header become HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ \.php$ { return 404; }
}
