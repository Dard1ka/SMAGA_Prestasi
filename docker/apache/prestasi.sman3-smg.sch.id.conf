# SMAGA Talent Hub: host Apache 2.4.29 (Ubuntu 18.04) vhost sample, thin TLS reverse proxy.
# Install: /etc/apache2/sites-available/prestasi.sman3-smg.sch.id.conf (steps: docs/DEPLOY.md §6).
# Modules: sudo a2enmod proxy proxy_http headers ssl   (the STH vhost uses no mod_rewrite, PHP, CGI or .htaccess)
# Rules: docs/SECURITY.md §3e. Upstream = web container, bound to 127.0.0.1:8080 only (docker/compose.prod.yaml).
#
# Two phases, because Apache refuses to start with a missing certificate file:
#   1. only the HTTP block (between the "# >>> http" / "# <<< http" markers) → certbot certonly --webroot
#   2. the whole file once /etc/letsencrypt/live/prestasi.sman3-smg.sch.id/ exists
#
# Global settings (affect the WordPress vhost too, agree with its maintainer first; not in this file):
#   ServerTokens Prod · ServerSignature Off · TraceEnable Off   (/etc/apache2/conf-available/security.conf)

# >>> http
<VirtualHost *:80>
    ServerName prestasi.sman3-smg.sch.id

    # Empty directory that only ever holds ACME http-01 tokens (certbot --webroot -w /var/www/letsencrypt).
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Everything except ACME challenges → HTTPS (mod_alias, no mod_rewrite).
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://prestasi.sman3-smg.sch.id/$1"

    ErrorLog  ${APACHE_LOG_DIR}/prestasi-error.log
    CustomLog ${APACHE_LOG_DIR}/prestasi-access.log combined
</VirtualHost>
# <<< http

<VirtualHost *:443>
    ServerName prestasi.sman3-smg.sch.id

    # Never serve local files from this vhost (everything is proxied); do not inherit the WordPress DocumentRoot.
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    # HTTP/1.1 only: mod_http2 of 2.4.29 is too old (CVE-2024-27316 fixed in ESM only), even if enabled globally.
    Protocols http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/prestasi.sman3-smg.sch.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/prestasi.sman3-smg.sch.id/privkey.pem
    # TLS 1.3 needs apache2 >= 2.4.29-1ubuntu4.12 (LP #1845263); check `dpkg -l apache2`.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off
    SSLCompression off
    # Let's Encrypt ended OCSP (Aug 2025). Note: Apache has no end-of-line comments; keep comments on own lines.
    SSLUseStapling off

    # Reverse proxy, never a forward/open proxy. The real Host reaches Laravel; TrustHosts rejects anything else.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    # Client-supplied forwarding headers are never trusted. mod_proxy_http APPENDS X-Forwarded-Host/-For to
    # what the client sent and Symfony reads the FIRST X-Forwarded-Host element → strip them "early" (before
    # mod_proxy adds its own values), SECURITY §3e. Result at the backend: X-Forwarded-For = real client IP only,
    # X-Forwarded-Host = this vhost (and Laravel does not trust X-Forwarded-Host anyway).
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Server early
    RequestHeader unset X-Forwarded-Prefix early
    RequestHeader unset Forwarded early
    RequestHeader unset X-Real-IP early
    RequestHeader unset Proxy early
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyPass        / http://127.0.0.1:8080/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    # 25 MB, same as nginx client_max_body_size and PHP post_max_size (SECURITY §3d).
    LimitRequestBody 26214400

    # HSTS only here (not in Laravel), WITHOUT includeSubDomains/preload (other *.sman3-smg.sch.id may be HTTP).
    Header unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000"
    # Fallbacks for responses that do not carry them (static files, proxy errors). "setifempty" never duplicates
    # the headers Laravel's SecurityHeaders middleware already sets. CSP is Laravel's job (nonce per request).
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty X-Frame-Options "DENY"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header setifempty Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always unset X-Powered-By
    Header unset X-Powered-By
    ServerSignature Off

    ErrorLog  ${APACHE_LOG_DIR}/prestasi-error.log
    CustomLog ${APACHE_LOG_DIR}/prestasi-access.log combined
</VirtualHost>
