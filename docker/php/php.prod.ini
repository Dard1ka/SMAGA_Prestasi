; SMAGA Talent Hub: production overrides (docker/Dockerfile.prod). Loaded after zz-sth.ini as zzz-sth-prod.ini,
; on top of PHP's php.ini-production. See docs/SECURITY.md §3d (upload limits) and §3j (PHP prod settings).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off
zend.exception_ignore_args = On
zend.assertions = -1
allow_url_include = Off

memory_limit = 256M
max_execution_time = 30
max_input_time = 60
max_input_vars = 2000

; Same limit on all three layers: PHP here, nginx client_max_body_size 25m, Apache LimitRequestBody 25 MB.
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 10

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Code is baked into a read-only image: never re-stat files. A new image = a new container = a fresh cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
