; SMAGA Talent Hub — local development php-fpm pool settings.
; compose.yaml mounts this as php-fpm.d/zzz-sth-dev.conf. Production never reads this file.
;
; WHY THIS FILE EXISTS (docs/dev-notes/M1.md, "Page speed")
; The repo is bind-mounted from a Windows drive, where every stat() costs ~6 ms (php.dev.ini has the
; numbers). After opcache stopped re-checking PHP files, one page still made ~400 file checks:
;   ~165  Blade: is the compiled view there, is the source newer (storage/framework/views + resources/views)
;   ~140  config: Laravel scans config/ and the framework's config/ on every request
; These three variables move both off the Windows drive, for php-fpm ONLY:
;   - compiled views go to the container's own filesystem and are not compared with the source any more;
;   - the config is read from one cached file in the container's own filesystem (written by
;     docker/php/dev-cache.sh; when that file does not exist Laravel loads the config the normal way).
;
; WHY HERE AND NOT IN compose.yaml `environment:` / .env
; Pool `env[...]` reaches the php-fpm workers only. The command line (artisan, the test suite, the queue
; and scheduler containers) never sees APP_CONFIG_CACHE, so a test run can never pick up a cached config
; with APP_ENV=local and the dev MySQL connection — the mistake that once wiped the dev database.
;
; THE TRADE-OFF is the one php.dev.ini already has: after editing .php, .blade.php, config/*.php or .env
; run reload.bat (docker/php/dev-cache.sh). CSS and JS are not affected.
;
; THREE FIXED WORKERS
; Every php-fpm worker has its own realpath cache, and a new worker starts with an empty one: its first
; requests then look up thousands of paths on the Windows drive again (measured: 1.2-4 s for the first page
; after logging in, 0.4-0.8 s for the first visit of each menu). With `pm = dynamic` workers come and go, so
; this kept happening. Three workers that stay are enough for one developer (page + hover prefetch + a
; Livewire update), and docker/php/dev-cache.sh warms all three right after a reload.
[www]
pm = static
pm.max_children = 3
env[APP_CONFIG_CACHE] = /tmp/sth-cache/config.php
env[VIEW_COMPILED_PATH] = /tmp/sth-cache/views
; Quoted on purpose: a bare `false` is an empty value to the php-fpm config parser and stops php-fpm from starting.
env[VIEW_CHECK_CACHE_TIMESTAMPS] = "false"
