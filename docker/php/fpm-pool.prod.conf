; SMAGA Talent Hub: php-fpm pool overrides for production (installed as php-fpm.d/zzz-sth-pool.conf).
; The master runs as www-data (image USER), so the base www.conf user/group lines are ignored.
; Sizing follows docs/SECURITY.md §3j "Anggaran RAM 8 GB": ~80-100 MB per worker, container limit 1536 MB.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 60s

; Liveness endpoint for docker/php/healthcheck.sh. Reachable only over FastCGI on the backend network;
; nginx only ever forwards SCRIPT_NAME=/index.php, so this path is not exposed through the web server.
ping.path = /fpm-ping
ping.response = pong

; Keep the container environment (env_file) visible to workers as a fallback when config is not cached.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Web requests never spawn processes (SECURITY §3j). CLI (queue, scheduler, artisan) is not affected.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
