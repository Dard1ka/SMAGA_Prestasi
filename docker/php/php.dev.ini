; SMAGA Talent Hub — local development PHP settings.
; compose.yaml mounts this as conf.d/zzz-sth-dev.ini, so it is loaded AFTER zz-sth.ini and wins.
; Production never reads this file; it uses docker/php/php.prod.ini.
;
; WHY THIS FILE EXISTS
; The repo is bind-mounted from a Windows drive into the container. Measured on this machine:
;   stat() on the bind mount   5.938 ms per file
;   stat() on the container fs 0.002 ms per file   (~3000x faster)
; Laravel touches hundreds to thousands of files per request, so letting opcache re-check timestamps
; cost 6-16 s per page. Switching the re-checks off brought the same pages to ~0.6 s.
;
; THE TRADE-OFF (only while the repo lives on a Windows drive)
; With validate_timestamps = 0 opcache never re-reads a file it has cached, so edits to .php AND to
; .blade.php files are not picked up until php-fpm reloads:
;
;     reload.bat                            (or: docker compose exec app kill -USR2 1)
;
; CSS and JS are not affected — they are served by Vite/nginx, not by PHP.
;
; MOVING THE REPO TO A LINUX FILESYSTEM (WSL2 home, or Docker on Linux/macOS) REMOVES THE TRADE-OFF:
; stats become effectively free, so set validate_timestamps = 1 below and the reload step disappears.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; vendor/ alone holds >11,000 PHP files, so the 10,000 default made opcache evict and recompile.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.save_comments = 1

realpath_cache_size = 8192K
realpath_cache_ttl = 600
